[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantastic"
version = "0.1.0"
description = "A game about steering growing plants by cutting them"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
]

[tool.setuptools.packages.find]
include = ["plantastic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
